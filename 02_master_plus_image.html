
<!-- MASTER + IMAGE PATCH -->
<div class="masterInputActions">

  <button class="plusImageBtn" type="button"
    onclick="document.getElementById('masterImageInput').click()">
    + IMAGE
  </button>

  <input
    id="masterImageInput"
    type="file"
    accept="image/*"
    style="display:none"
    onchange="masterImageSelected()"
  />

</div>

<img id="masterImagePreview" class="masterImagePreview">
