<!-- =========================================================
PHASE 18 - VERIFIED FIX SYSTEM CARD
Paste this card where your Diesel Brain / Smart Repair Kit cards are.
========================================================= -->
<div class="smartCard" id="verifiedFixCard">
  <div class="cardTitleRow">
    <h2>✅ VERIFIED FIX</h2>
    <span class="pill green">SHOP MEMORY</span>
  </div>

  <label>Symptom / Search</label>
  <input id="vfSearch" placeholder="X15 water pump leak, SPN 2791, no regen...">

  <label>Fault Code</label>
  <input id="vfCode" placeholder="SPN / FMI / P-code">

  <label>Confirmed Fix</label>
  <textarea id="vfFix" placeholder="What actually fixed it?"></textarea>

  <label>Parts Used</label>
  <textarea id="vfParts" placeholder="OEM part numbers, seals, gaskets, fluids..."></textarea>

  <label>Labor Hours</label>
  <input id="vfLabor" type="number" step="0.1" placeholder="2.5">

  <label>Tech Notes</label>
  <textarea id="vfNotes" placeholder="Warnings, tricks, torque specs, test steps..."></textarea>

  <div class="row">
    <button class="success" onclick="saveVerifiedFix()">SAVE VERIFIED FIX</button>
    <button onclick="findVerifiedFixes()">SEARCH FIX MEMORY</button>
  </div>

  <div id="vfOut" class="result">No verified fix loaded.</div>
</div>
