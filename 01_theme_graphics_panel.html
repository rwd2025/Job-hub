<!-- =========================================================
ROLLING WRENCH AI - THEME / GRAPHICS ENGINE PANEL
Paste inside your Settings panel, or near bottom before </body>.
========================================================= -->

<div id="rwThemeEnginePanel" class="rwThemeEnginePanel">
  <div class="rwThemeHeader">
    <strong>🎨 VISUAL SYSTEM</strong>
    <span>Rolling Wrench AI</span>
  </div>

  <label>Brand Theme</label>
  <div class="rwThemeGrid">
    <button onclick="setRwBrandTheme('rolling')">Rolling Wrench</button>
    <button onclick="setRwBrandTheme('cat')">CAT</button>
    <button onclick="setRwBrandTheme('cummins')">Cummins</button>
    <button onclick="setRwBrandTheme('detroit')">Detroit</button>
    <button onclick="setRwBrandTheme('paccar')">PACCAR</button>
    <button onclick="setRwBrandTheme('nightops')">Night Ops</button>
    <button onclick="setRwBrandTheme('brightshop')">Bright Shop</button>
    <button onclick="setRwBrandTheme('carbon')">Carbon Steel</button>
  </div>

  <label>Brightness Mode</label>
  <div class="rwThemeGrid three">
    <button onclick="setRwLightMode('day')">Daylight</button>
    <button onclick="setRwLightMode('shop')">Shop</button>
    <button onclick="setRwLightMode('night')">Night</button>
  </div>

  <label>Logo Style</label>
  <div class="rwThemeGrid">
    <button onclick="setRwLogoStyle('shoppro')">Shop Pro</button>
    <button onclick="setRwLogoStyle('chrome')">Chrome</button>
    <button onclick="setRwLogoStyle('minimal')">Minimal</button>
    <button onclick="setRwLogoStyle('industrial')">Industrial</button>
  </div>

  <div class="rwThemePreview">
    <div class="rwPreviewLogo" id="rwPreviewLogo">RW</div>
    <div>
      <strong>Preview</strong>
      <p>Buttons, cards, AI panels, and tool screens update instantly.</p>
    </div>
  </div>
</div>
