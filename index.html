<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mechanic Pro BEAST</title>

<style>
body{background:#050505;color:#fff;font-family:Arial;padding:12px}
.card{background:#111;border:1px solid #333;padding:12px;border-radius:10px;margin-bottom:10px}
button{padding:12px;border-radius:8px;border:0;font-weight:bold;margin-top:6px}
.green{background:#22c76a;color:#000}
.blue{background:#3478f6}
.back{background:#222;border:1px solid #444;color:#fff;width:100%}
.result{white-space:pre-wrap;background:#0d1a22;padding:10px;border-radius:8px}
.section{display:none}
.section.active{display:block}
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="section active">
<div class="card">
<h2>🔧 BEAST MODE</h2>
<input id="vin" placeholder="VIN / Unit">
<select id="engine">
<option>Detroit DD15</option>
<option>Cummins ISX</option>
<option>PACCAR MX-13</option>
</select>

<button onclick="show('parts')">PARTS</button>
<button onclick="show('describe')">DESCRIBE</button>
</div>
</div>

<!-- PARTS -->
<div id="parts" class="section">
<button class="back" onclick="show('home')">← BACK</button>

<div class="card">
<h3>Parts Beast</h3>

<input id="partq" placeholder="Part number or name">
<input id="year" placeholder="Year">
<textarea id="note" placeholder="Notes"></textarea>

<button class="green" onclick="askPart()">LOOKUP</button>
<button class="blue" onclick="verifiedSearch()">VERIFY WITH WEB</button>

<div id="out" class="result"></div>
</div>
</div>

<!-- DESCRIBE -->
<div id="describe" class="section">
<button class="back" onclick="show('home')">← BACK</button>

<div class="card">
<textarea id="desc" placeholder="tube under turbo leaking oil"></textarea>
<button class="green" onclick="describe()">IDENTIFY</button>
<div id="descOut" class="result"></div>
</div>
</div>

<script>

const API_URL = "https://uxpkqwcmvtqvubibbrek.supabase.co/functions/v1/diesel-doc-ai";

function $(id){return document.getElementById(id)}
function show(id){
 document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
 $(id).classList.add("active");
}

function ctx(){
 return `VIN:${$("vin").value} Engine:${$("engine").value}`;
}

/* VALIDATION */
function validate(num,ans){
 let l=ans.toLowerCase();

 if(num==="23539639" && l.includes("injector")){
   return "❌ BLOCKED\n\n23539639 = EGR Delta Pressure Sensor\nNOT injector";
 }

 return ans;
}

/* PARTS */
async function askPart(){
 let q=$("partq").value;
 if(!q)return alert("enter part");

 $("out").textContent="Loading...";

 let prompt=`Diesel part lookup

Part:${q}
Context:${ctx()}

Rules:
Give multiple options
No guessing
Include years`;

 let res=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({mode:"parts",question:prompt})
 });

 let data=await res.json();
 let ans=data.answer||"no answer";

 let num=(q.match(/[0-9]{5,}/)||[""])[0];
 if(num) ans=validate(num,ans);

 $("out").textContent=ans;
}

/* 🔥 VERIFIED SEARCH (READY FOR SUPABASE) */
async function verifiedSearch(){
 let q=$("partq").value;
 if(!q)return alert("enter part");

 $("out").textContent="Searching real sources...";

 try{
 let res=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
     mode:"verified_parts_web",
     question:q,
     vehicleContext:ctx()
   })
 });

 let data=await res.json();

 if(data.answer){
   $("out").textContent=data.answer;
 }else{
   $("out").textContent="⚠️ Web verification not active yet.\n\nStill using AI only.\n\nAdd Supabase search to unlock full power.";
 }

 }catch(e){
   $("out").textContent="Web search not active yet.";
 }
}

/* DESCRIBE */
function describe(){
 let t=$("desc").value.toLowerCase();

 if(t.includes("turbo") && t.includes("oil")){
   $("descOut").textContent=
`Most likely:
- Turbo oil drain line
- Turbo oil feed line`;
 }else{
   $("descOut").textContent=
`Possible:
- Charge air pipe
- Exhaust pipe
- Sensor line`;
 }
}

</script>

</body>
</html>
