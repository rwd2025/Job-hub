<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mobile Mechanic Pro V36</title>

<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial;padding:14px}
.card{background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:12px}
button{padding:12px;border-radius:8px;border:0;font-weight:bold}
.backBtn{background:#222;border:1px solid #444;color:#fff;width:100%;margin-bottom:10px}
.green{background:#22c76a;color:#000}
.result{background:#0d1a22;border:1px solid #315b78;padding:12px;border-radius:10px;white-space:pre-wrap}
.section{display:none}
.section.active{display:block}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="section active">
<div class="card">
<h2>Mobile Mechanic Pro</h2>
<button onclick="show('parts')">Parts</button>
</div>
</section>

<!-- PARTS -->
<section id="parts" class="section">
<button class="backBtn" onclick="show('home')">← BACK</button>

<div class="card">
<h3>Part Lookup</h3>

<input id="filterNumber" placeholder="Enter part number">
<textarea id="filterq" placeholder="Notes"></textarea>

<button class="green" onclick="lookupFilterNumber()">LOOKUP</button>

<div id="filterAnswer" class="result"></div>

</div>
</section>

<script>

// NAV
function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// API
async function callAI(question){
  const res = await fetch("https://uxpkqwcmvtqvubibbrek.supabase.co/functions/v1/diesel-doc-ai",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({question})
  });
  const data = await res.json();
  return data.answer || "No answer";
}

// VALIDATION
function validatePartAnswer(num, answer){
  const lower = (answer || "").toLowerCase();

  if (!lower.includes(num.toLowerCase())) {
    return `UNKNOWN — exact part number ${num} not confirmed.`;
  }

  const bad = ["probably","likely","injector","filter"];

  for (const b of bad){
    if(lower.includes(b)){
      return `UNKNOWN — AI guess blocked. Verify ${num}`;
    }
  }

  return answer;
}

// FIXED LOOKUP
async function lookupFilterNumber(){
  let num = document.getElementById("filterNumber").value.trim();
  let note = document.getElementById("filterq").value.trim();

  if(!num) return alert("Enter part number");

  document.getElementById("filterAnswer").textContent = "Looking up...";

  try{
    let answer = await callAI(`
Exact OEM part lookup ONLY.

Part number: ${num}

Rules:
- Match exact number only
- Do not guess
- If not found say UNKNOWN
`);

    answer = validatePartAnswer(num, answer);

    document.getElementById("filterAnswer").textContent = answer;

  }catch(e){
    document.getElementById("filterAnswer").textContent = "Error: "+e.message;
  }
}

</script>

</body>
</html>
