<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile Mechanic Pro V36</title>
<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial;padding:12px 12px 90px}
button{padding:14px;border-radius:10px;border:0;background:#ff6500;color:#fff;font-weight:bold;margin:4px 0}
input,textarea,select{width:100%;padding:12px;margin:6px 0;background:#111;color:#fff;border:1px solid #333;border-radius:8px}
.section{display:none}.section.active{display:block}
.card{background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:12px}
.result{background:#0d1a22;padding:12px;border-radius:10px;margin-top:10px;white-space:pre-wrap}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:10px}
.nav button{background:#222}
</style>
</head>
<body>

<div id="home" class="section active">
  <h2>Mobile Mechanic Pro V36</h2>
  <div class="card">
    <button onclick="show('parts')">Parts Lookup</button>
    <button onclick="show('doc')">Diesel Doc</button>
  </div>
</div>

<div id="parts" class="section">
  <h2>Part Finder Pro</h2>

  <div class="card">
    <label>Part / Filter / Casting Number</label>
    <input id="partq" placeholder="PF7748, 4965569, A4721803309">

    <label>Brand</label>
    <select id="brand">
      <option value="">Auto Detect / Unknown</option>
      <option>Fleetguard</option>
      <option>Baldwin</option>
      <option>Donaldson</option>
      <option>WIX</option>
      <option>Cummins</option>
      <option>PACCAR</option>
      <option>Detroit Diesel</option>
      <option>OEM</option>
    </select>

    <label>Part Type</label>
    <select id="partType">
      <option value="">Auto Detect</option>
      <option>Filter</option>
      <option>Seal</option>
      <option>Bearing</option>
      <option>Sensor</option>
      <option>Gasket</option>
      <option>Kit</option>
      <option>Fuel System</option>
      <option>Cooling System</option>
      <option>Lubrication System</option>
      <option>Air / Turbo / EGR</option>
      <option>Aftertreatment</option>
      <option>Electrical</option>
      <option>Brake</option>
      <option>Wheel End</option>
      <option>Suspension</option>
    </select>

    <label>Engine / Platform</label>
    <select id="engine">
      <option value="">Unknown / Auto</option>
      <option>Cummins ISX15 / X15</option>
      <option>PACCAR MX-13</option>
      <option>PACCAR MX-11</option>
      <option>Detroit DD13</option>
      <option>Detroit DD15</option>
      <option>Detroit DD16</option>
      <option>CAT C15</option>
      <option>CAT C13</option>
      <option>International MaxxForce</option>
      <option>Powerstroke</option>
      <option>Duramax</option>
    </select>

    <label>Notes</label>
    <textarea id="note" placeholder="Example: customer says this came off DD15 oil module"></textarea>

    <button onclick="lookupPart()">LOOKUP PART</button>

    <div id="partAnswer" class="result">Enter a part number.</div>
  </div>
</div>

<div id="doc" class="section">
  <h2>Diesel Doc</h2>
  <div class="card">
    <textarea id="question" placeholder="Enter symptom, code, or repair question"></textarea>
    <button onclick="askDoc()">DIAGNOSE</button>
    <div id="answer" class="result">Ask Diesel Doc.</div>
  </div>
</div>

<div class="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('parts')">Parts</button>
  <button onclick="show('doc')">Doc</button>
</div>

<script>
function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

async function callAI(question, notes = "", mode = "parts") {
  const res = await fetch("https://uxpkqwcmvtqvubibbrek.supabase.co/functions/v1/diesel-doc-ai", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({question, notes, mode})
  });

  const data = await res.json();

  if (!res.ok) {
    throw new Error(data.error || "Server failed");
  }

  return data.answer || "No answer returned.";
}

async function lookupPart(){
  const part = document.getElementById("partq").value.trim();
  const brand = document.getElementById("brand").value;
  const partType = document.getElementById("partType").value;
  const engine = document.getElementById("engine").value;
  const note = document.getElementById("note").value.trim();

  if(!part) return alert("Enter part number");

  document.getElementById("partAnswer").textContent = "Checking verified database first...";

  const prompt = `
PART LOOKUP REQUEST

Part Number: ${part}
Selected Brand: ${brand || "unknown"}
Selected Part Type: ${partType || "auto detect"}
Selected Engine: ${engine || "unknown"}
Notes: ${note || "none"}

Rules:
- Check verified database first.
- If database match exists, return database match only.
- If no database match, do not guess exact fitment.
- If user selected part type, respect it.
- If selected type is Seal, do not call it a bearing.
- If selected type is Filter, explain filter use and cross references.
`;

  try{
    const ans = await callAI(prompt, note, "parts");
    document.getElementById("partAnswer").textContent = ans;
  }catch(e){
    document.getElementById("partAnswer").textContent = "ERROR: " + e.message;
  }
}

async function askDoc(){
  const q = document.getElementById("question").value.trim();
  if(!q) return alert("Enter question");

  document.getElementById("answer").textContent = "Thinking...";

  try{
    const ans = await callAI(q, "", "diagnose");
    document.getElementById("answer").textContent = ans;
  }catch(e){
    document.getElementById("answer").textContent = "ERROR: " + e.message;
  }
}
</script>

</body>
</html>
