
<!-- =========================================================
ROLLING WRENCH AI - MASTER CHAT BAR
Replace your old MASTER input area with this.
Looks like ChatGPT style: + button, input, mic, send/AI.
========================================================= -->

<div class="rwMasterChatBar">

  <button class="rwMasterPlus" type="button"
    onclick="document.getElementById('masterImageInput').click()">
    +
  </button>

  <div class="rwMasterInputWrap">

    <textarea
      id="masterInput"
      class="rwMasterInput"
      rows="1"
      placeholder="Ask Rolling Wrench AI"
      oninput="rwAutoGrowMasterInput(this)"
    ></textarea>

    <button class="rwMasterMic" type="button" onclick="startRwVoiceInput()">
      🎙️
    </button>

    <button class="rwMasterSend" type="button" onclick="runMasterSearch()">
      ▌▌▌
    </button>

  </div>

  <input
    id="masterImageInput"
    type="file"
    accept="image/*"
    style="display:none"
    onchange="masterImageSelected()"
  />

</div>

<img id="masterImagePreview" class="masterImagePreview">
